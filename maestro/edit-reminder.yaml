appId: com.aakashsrinivasan.healtime
---

# Edit Reminder Flow
# Sets up its own reminder first so this flow can run independently of
# add-reminder.yaml, then edits it and checks the update sticks.
- launchApp
- tapOn: "HealTime"
- tapOn: "Get Started Be Healthy"
- tapOn:
    point: "90%,84%"
- inputText: "Liver Tonic"
- pressKey: Enter
- tapOn:
    point: "50%,25%"
- tapOn: "10"
- tapOn: "10"
- tapOn: "OK"
- tapOn: "After Food"
- tapOn: "Syrup"
- tapOn: "15 ml"
- tapOn: "Set Reminder"
- assertVisible: "Scheduled!"
- tapOn: "OK"

# Update Reminder
- tapOn:
    text:
    index: 0
- tapOn: "Medicine Name"
- eraseText
- inputText: "Liver Tonic Stomach Pain"
- tapOn:
    point: "50%,25%"
- tapOn: "10"
- tapOn: "30"
- tapOn: "OK"
- tapOn: "After Food"
- tapOn: "Syrup"
- tapOn: "15 ml"
- tapOn: "Set Reminder"
- assertVisible: "Updated"
- tapOn: "OK"
- assertVisible: "Liver Tonic Stomach Pain"
